<html lang="ja">

<title>ページが見つかりません｜浅倉大介 クレジットデータベース</title>
<!-- A 404 must never be indexed, and GitHub Pages serves this file for any missing path
     under /da_db_site/. -->
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/png" sizes="256x256" href="/da_db_site/favicon.png">
<meta name="theme-color" content="#05070d">
<style>
:root { --bg:#05070d; --card:#0a0f1a; --cyan:#00fff2; --dim:#63808c;

* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:#d6f7f5;

  display:flex; align-items:center; justify-content:center; padding:32px 20px;
  background-image:linear-gradient(rgba(0,255,242,0.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,242,0.045) 1px, transparent 1px);
  background-size:42px 42px; }
main { width:100%; max-width:520px; border:1px solid var(--border); border-radius:6px;
  background:var(--card); padding:38px 34px 32px; }
h1 { margin:0 0 18px; font-size:20px; letter-spacing:2px; color:var(--cyan);
  font-weight:normal; line-height:1.4; }
p { color:var(--dim); font-size:13px; line-height:1.95; margin:0 0 24px; }
a { display:inline-block; border:1px solid var(--cyan); color:var(--cyan);
  text-decoration:none; padding:12px 26px; border-radius:4px; letter-spacing:3px;
  font-size:12px; }
a:hover { background:rgba(0,255,242,0.13); }

</head>

<main>
