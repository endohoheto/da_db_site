* { box-sizing:border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:"Share Tech Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  display:flex; align-items:center; justify-content:center; padding:32px 20px;

main { width:100%; max-width:660px; border:1px solid var(--border); border-radius:6px;

.mark { display:flex; align-items:center; gap:18px; margin-bottom:24px; }
.mark img { width:56px; height:56px; border-radius:12px; display:block; }

.sub { color:var(--purple); font-size:11px; letter-spacing:3px; margin-top:6px; }
p { color:var(--dim); font-size:13px; line-height:1.95; margin:0 0 22px; }
.tags { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 26px; }
.tags span { border:1px solid var(--border); border-radius:3px; padding:5px 9px;
  font-size:10.5px; letter-spacing:1.5px; color:var(--dim); }
.enter { display:inline-block; border:1px solid var(--cyan); color:var(--cyan);
  text-decoration:none; padding:13px 30px; border-radius:4px; letter-spacing:3px;
  font-size:13px; transition:background .15s ease; }
.enter:hover { background:rgba(0,255,242,0.13); }
.note { color:var(--dim); font-size:10.5px; letter-spacing:1px; margin-top:20px;
  opacity:.75; line-height:1.8; }
</style>
